name: Release v1.0.0

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/release-v1.0.0.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build Skill package
        run: |
          zip -r apple-music-personal-curator-v1.0.0.zip \
            SKILL.md \
            README.md \
            CHANGELOG.md \
            CONTRIBUTING.md \
            LICENSE \
            RELEASE-v1.0.0.md \
            docs \
            examples \
            -x "*.DS_Store"

      - name: Create or update GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view v1.0.0 >/dev/null 2>&1; then
            gh release upload v1.0.0 apple-music-personal-curator-v1.0.0.zip --clobber
          else
            gh release create v1.0.0 \
              apple-music-personal-curator-v1.0.0.zip \
              --target "${GITHUB_SHA}" \
              --title "Apple Music Personal Curator v1.0.0" \
              --notes-file RELEASE-v1.0.0.md
          fi
